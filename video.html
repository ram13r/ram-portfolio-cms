<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAM Portfolio — Video</title><style>html,body{margin:0;min-height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}.bar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:1px solid #333}.bar a{color:#fff;text-decoration:none}.wrap{min-height:calc(100vh - 61px);display:grid;place-items:center;padding:20px}.stage{position:relative;display:grid;place-items:center}.stage video{max-width:95vw;max-height:82vh;background:#000}.watermark{position:absolute;right:14px;top:14px;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.5);padding:7px 10px;font-size:10px;font-weight:bold;letter-spacing:.12em;pointer-events:none}.error{display:none;max-width:600px;padding:20px;background:#331e1e;line-height:1.5}</style></head><body><header class="bar"><a href="index.html">← Back to portfolio</a><strong id="title">Portfolio Video</strong><span>RAM PRAKASH ©</span></header><main class="wrap"><div class="stage"><video id="player" controls autoplay playsinline></video><span class="watermark">RAM PRAKASH ©</span></div><div id="error" class="error">Your browser cannot decode this video. Please contact the creator for an alternate preview.</div></main><script>const q=new URLSearchParams(location.search),src=q.get('src')||'',title=q.get('title')||'Portfolio Video',p=document.getElementById('player');document.getElementById('title').textContent=title;p.src=src;p.addEventListener('error',()=>{document.querySelector('.stage').style.display='none';document.getElementById('error').style.display='block'});</script></body></html>
